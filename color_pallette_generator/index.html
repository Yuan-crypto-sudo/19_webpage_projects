<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Palette Generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">

        <h1>Color Palette generator</h1>

        <button id="generate-btn">

            <i class="fas fa-sync-alt"></i>

            Generate Palette

        </button>

        <div class="palette-container">
            <!-- Color Box 1 -->
            <div class="color-box">
                <div class="color" style="background-color: #ABCFC9;"></div>
                <div class="color-info">
                    <span class="hex-value">#ABCFC9</span>
                    <i class="far fa-copy copy-btn" title="Copy to Clipboard"></i>
                </div>
            </div>

            <!-- Color Box 2 -->
            <div class="color-box">
                <div class="color" style="background-color: #BBCFC9;"></div>
                <div class="color-info">
                    <span class="hex-value">#BBCFC9</span>
                    <i class="far fa-copy copy-btn" title="Copy to Clipboard"></i>
                </div>
            </div>

            <!-- Color Box 3 -->
            <div class="color-box">
                <div class="color" style="background-color: #CBCFC9;"></div>
                <div class="color-info">
                    <span class="hex-value">#CBCFC9</span>
                    <i class="far fa-copy copy-btn" title="Copy to Clipboard"></i>
                </div>
            </div>

            <!-- Color Box 4 -->
            <div class="color-box">
                <div class="color" style="background-color: #DBCFC9;"></div>
                <div class="color-info">
                    <span class="hex-value">#DBCFC9</span>
                    <i class="far fa-copy copy-btn" title="Copy to Clipboard"></i>
                </div>
            </div>

        </div>

    </div>

    <script src="script.js"></script>
  </body>
</html>
